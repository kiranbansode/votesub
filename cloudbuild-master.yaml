steps:
    # node images no longer ship yarn. This repo vendors Yarn 3 via .yarnrc.yml yarnPath.
    - name: 'node:20'
      entrypoint: 'node'
      args: ['.yarn/releases/yarn-3.2.2.cjs', 'install']
      env: ['HUSKY=0']
    - name: 'node:20'
      entrypoint: 'node'
      args: ['.yarn/releases/yarn-3.2.2.cjs', 'build']
    - name: gcr.io/kiranbansode-votesub/firebase
      args: ['deploy', '--project=kiranbansode-votesub', '--only=hosting']
