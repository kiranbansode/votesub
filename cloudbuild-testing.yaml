steps:
    # node images no longer ship yarn. This repo vendors Yarn 3 via .yarnrc.yml yarnPath.
    - name: 'node:20'
      entrypoint: 'node'
      args: ['.yarn/releases/yarn-3.2.2.cjs', 'install']
      env: ['HUSKY=0']
    - name: 'node:20'
      entrypoint: 'node'
      args: ['.yarn/releases/yarn-3.2.2.cjs', 'build']
    # gcr.io/kiranbansode-votesub/firebase was a custom image pushed to Container Registry,
    # which Google shut down (2025-03-18). Use Google's maintained Firebase CLI builder instead.
    - name: us-docker.pkg.dev/firebase-cli/us/firebase
      args: ['hosting:channel:deploy', 'testing', '--project=kiranbansode-votesub']
